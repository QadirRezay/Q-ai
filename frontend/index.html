<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexora Code AI | دستیار هوشمند برنامه‌نویسی</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>
    <div class="app-layout">
        <!-- منوی کناری (Sidebar) -->
        <aside class="sidebar">
            <div class="brand">
                <span class="logo-dot"></span>
                <h2>Nexora Code AI</h2>
            </div>

            <div class="sidebar-section">
                <label for="session-input">شناسه پروژه / گفتگو:</label>
                <input type="text" id="session-input" value="project_1" placeholder="مثلاً: python_bot">
                <button id="load-history-btn" class="sidebar-btn">بارگذاری تاریخچه</button>
            </div>

            <div class="sidebar-section">
                <label for="language-select">زبان برنامه‌نویسی:</label>
                <select id="language-select">
                    <option value="Python">Python</option>
                    <option value="JavaScript">JavaScript</option>
                    <option value="TypeScript">TypeScript</option>
                    <option value="HTML/CSS">HTML / CSS</option>
                    <option value="C++">C++</option>
                    <option value="Java">Java</option>
                    <option value="SQL">SQL</option>
                    <option value="Bash">Bash / Linux</option>
                </select>
            </div>

            <div class="sidebar-footer">
                <button id="clear-btn" class="danger-btn">پاک کردن حافظه این گفتگو</button>
            </div>
        </aside>

        <!-- بخش اصلی چت و کدنویسی -->
        <main class="main-chat">
            <header class="chat-header">
                <div class="status-indicator">
                    <span class="status-online"></span>
                    <span>متصل به سرور FastAPI (127.0.0.1:8000)</span>
                </div>
                <div class="export-group">
                    <button id="download-txt-btn" class="export-btn">دانلود نوت‌پد (.txt)</button>
                    <button id="download-pdf-btn" class="export-btn">دانلود PDF</button>
                </div>
            </header>

            <section id="chat-box" class="chat-messages">
                <div class="message ai-message">
                    <div class="message-header">دستیار کدنویسی</div>
                    <div class="message-body">
                        سلام! زبان برنامه‌نویسی را از منوی کناری انتخاب کنید و درخواست کدنویسی یا دیباگ خود را بنویسید.
                    </div>
                </div>
            </section>

            <footer class="chat-input-area">
                <textarea id="prompt-input" rows="3" placeholder="دستور کدنویسی خود را اینجا بنویسید (مثلاً: یک اسکریپت پایتون برای اتصال به API بنویس)..."></textarea>
                <button id="send-btn" class="primary-btn">ارسال درخواست</button>
            </footer>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
